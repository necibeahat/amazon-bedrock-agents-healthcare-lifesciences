[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-pharma-pipeline"
version = "0.1.0"
description = "Agentic Pharmaceutical Pipeline Data Engineering System"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Pharmaceutical Data Engineering Team"}
]
keywords = ["agents", "pharmaceutical", "data-engineering", "strands", "agentcore"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    # Strands Agent SDK for multi-agent orchestration
    "strands-agents>=0.1.0",
    
    # Web scraping and HTTP clients
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "selenium>=4.15.0",
    "robotparser>=1.0.0",
    
    # Database drivers
    "psycopg2-binary>=2.9.0",  # PostgreSQL
    "pymongo>=4.5.0",          # MongoDB
    "sqlalchemy>=2.0.0",       # ORM
    "alembic>=1.12.0",         # Database migrations
    
    # Data processing and validation
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "pydantic>=2.4.0",
    "jsonschema>=4.19.0",
    
    # Ontology and semantic processing
    "rdflib>=7.0.0",
    "owlready2>=0.45",
    "pronto>=2.5.0",
    
    # Machine learning and NLP
    "scikit-learn>=1.3.0",
    "spacy>=3.7.0",
    "transformers>=4.35.0",
    
    # Observability and monitoring
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation>=0.41b0",
    "langfuse>=2.0.0",
    
    # Configuration and environment
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    
    # Async support
    "asyncio>=3.4.3",
    "aiohttp>=3.8.0",
    "asyncpg>=0.29.0",
    
    # Utilities
    "tenacity>=8.2.0",  # Retry mechanisms
    "schedule>=1.2.0",  # Task scheduling
    "rich>=13.6.0",     # Rich console output
    "loguru>=0.7.0",    # Enhanced logging
]

[project.optional-dependencies]
dev = [
    # Testing frameworks
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "hypothesis>=6.88.0",  # Property-based testing
    
    # Code quality
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.4.0",
    
    # Documentation
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
    
    # Development tools
    "ipython>=8.16.0",
    "jupyter>=1.0.0",
]

deployment = [
    # AWS and AgentCore deployment
    "boto3>=1.29.0",
    "botocore>=1.32.0",
    "aws-cdk-lib>=2.100.0",
    
    # Container and orchestration
    "docker>=6.1.0",
    "kubernetes>=28.1.0",
]

[project.urls]
Homepage = "https://github.com/aws-samples/amazon-bedrock-agents-healthcare-lifesciences"
Repository = "https://github.com/aws-samples/amazon-bedrock-agents-healthcare-lifesciences"
Documentation = "https://github.com/aws-samples/amazon-bedrock-agents-healthcare-lifesciences/tree/main/agents_catalog/23-data-harmonisation-drug-dev-pipeline"

[project.scripts]
pharma-pipeline = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "property: Property-based tests", 
    "integration: Integration tests",
    "slow: Slow running tests",
    "requires_db: Tests that require database",
    "requires_network: Tests that require network access",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]