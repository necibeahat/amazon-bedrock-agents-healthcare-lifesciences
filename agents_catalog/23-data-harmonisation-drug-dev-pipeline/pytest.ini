[tool:pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    -v
markers =
    unit: Unit tests
    property: Property-based tests using Hypothesis
    integration: Integration tests
    slow: Slow running tests
    requires_db: Tests that require database connection
    requires_network: Tests that require network access
    web_scraper: Tests for Web Scraper Agent
    data_harmonizer: Tests for Data Harmonizer Agent
    quality_assurance: Tests for Quality Assurance Agent
    orchestration: Tests for multi-agent orchestration
    storage: Tests for storage management
    agentcore: Tests for AgentCore deployment